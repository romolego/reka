<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Canvas — гипотезы и канвасы</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="row">
      <div class="brand">
        <h1>Research Canvas</h1>
        <span class="pill">GitHub Pages • локальное хранение</span>
      </div>

      <div class="selectors">
        <select id="projectSelect" class="select" title="Проект"></select>
        <button class="btn" id="btnProjectNew">Новый проект</button>
        <button class="btn" id="btnProjectDup">Дублировать</button>
        <button class="btn danger" id="btnProjectDel">Удалить</button>

        <select id="segmentSelect" class="select" title="Сегмент"></select>
        <button class="btn" id="btnSegmentNew">Новый сегмент</button>
        <button class="btn danger" id="btnSegmentDel">Удалить сегмент</button>
      </div>

      <div class="header-actions">
        <button class="btn" id="btnExportJSON">Экспорт JSON</button>
        <button class="btn" id="btnImportJSON">Импорт JSON</button>
        <button class="btn" id="btnExportCSV">Экспорт CSV (гипотезы)</button>
        <button class="btn danger" id="btnResetAll">Сбросить всё</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <aside class="card" id="leftPanel">
      <div class="card-h">
        <h2>Навигация</h2>
        <span class="badge" id="storageBadge">Хранилище: —</span>
      </div>
      <div class="card-b">
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="hypotheses">Реестр гипотез</button>
          <button class="tab" data-tab="empathy">Empathy Map</button>
          <button class="tab" data-tab="vpd">VPD</button>
          <button class="tab" data-tab="bmc">BMC</button>
          <button class="tab" data-tab="prompts">Промпты</button>
          <button class="tab" data-tab="qa">Проверки</button>
        </div>

        <div class="field">
          <label>Поиск</label>
          <input id="searchInput" class="input" placeholder="текст / тэг / статус / тип..." />
        </div>

        <div class="filters">
          <div class="field">
            <label>Фильтр: статус</label>
            <select id="filterStatus" class="select">
              <option value="">все</option>
              <option value="new">не проверено</option>
              <option value="testing">в проверке</option>
              <option value="confirmed">подтверждено</option>
              <option value="rejected">опровергнуто</option>
            </select>
          </div>
          <div class="field">
            <label>Фильтр: риск</label>
            <select id="filterRisk" class="select">
              <option value="">все</option>
              <option value="desirability">желательность</option>
              <option value="feasibility">исполнимость</option>
              <option value="viability">жизнеспособность</option>
            </select>
          </div>
        </div>

        <div class="toolbar">
          <div class="kpi" id="kpiBox"></div>
          <button class="btn primary" id="btnAddHypothesis">Добавить гипотезу</button>
        </div>

        <div class="list" id="leftList"></div>
      </div>
    </aside>

    <section class="card" id="rightPanel">
      <div class="card-h">
        <h2 id="rightTitle">Карточка</h2>
        <div class="toolbar">
          <button class="btn" id="btnCopyPrompt">Скопировать промпт</button>
          <button class="btn primary" id="btnSave">Сохранить</button>
        </div>
      </div>
      <div class="card-b" id="rightBody"></div>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="dialog">
      <div class="dialog-h">
        <h3 id="modalTitle">Экспорт</h3>
        <button class="btn" id="modalClose">Закрыть</button>
      </div>
      <div class="dialog-b">
        <div class="field">
          <label>Данные</label>
          <textarea id="modalTextarea" class="textarea" rows="16"></textarea>
        </div>
        <div class="toolbar end">
          <button class="btn" id="modalCopy">Скопировать</button>
          <button class="btn primary" id="modalApply">Применить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
