<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Canvas + Hypotheses (MVP) — локально</title>
  <style>
    :root{
      --bg:#ffffff;
      --panel:#f6f7f9;
      --panel2:#ffffff;
      --line:#d9dde3;
      --text:#111827;
      --muted:#6b7280;
      --accent:#0f62fe;
      --danger:#b42318;
      --ok:#027a48;
      --warn:#b54708;
      --shadow:0 6px 16px rgba(17,24,39,.08);
      --radius:12px;
      --radius2:10px;
      --pad:12px;
      --pad2:10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--text);
      background: var(--bg);
    }
    header{
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel2);
      position: sticky;
      top:0;
      z-index: 5;
    }
    header .row{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }
    header h1{
      font-size: 16px;
      margin:0;
      font-weight: 700;
      letter-spacing:.2px;
    }
    .pill{
      font-size:12px;
      color: var(--muted);
      border:1px solid var(--line);
      padding:6px 10px;
      border-radius: 999px;
      background:#fff;
    }
    .btn{
      border:1px solid var(--line);
      background:#fff;
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      font-size: 12px;
      color: var(--text);
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn.primary{
      background: var(--accent);
      color:#fff;
      border-color: var(--accent);
    }
    .btn.danger{
      background:#fff;
      border-color:#f2c6c2;
      color: var(--danger);
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }
    .select, .input{
      border:1px solid var(--line);
      background:#fff;
      padding:8px 10px;
      border-radius:10px;
      font-size: 12px;
      min-width: 220px;
    }
    main{
      display:grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
      padding: 14px;
    }
    .card{
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card .card-h{
      padding: 12px 12px 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      display:flex;
      justify-content: space-between;
      gap:10px;
      align-items:center;
    }
    .card .card-h h2{
      font-size: 13px;
      margin:0;
      font-weight: 700;
    }
    .card .card-b{
      padding: 12px;
      background: var(--panel2);
    }
    .stack{ display:flex; flex-direction:column; gap:10px; }
    .muted{ color: var(--muted); font-size: 12px; }
    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .tab{
      font-size: 12px;
      border:1px solid var(--line);
      background:#fff;
      padding:8px 10px;
      border-radius: 999px;
      cursor:pointer;
    }
    .tab.active{
      border-color: var(--accent);
      color: var(--accent);
      background:#eef4ff;
    }
    .list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .item{
      border:1px solid var(--line);
      border-radius: 12px;
      background:#fff;
      padding:10px;
      cursor:pointer;
    }
    .item:hover{ border-color:#bfc8d6; }
    .item.active{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,98,254,.12); }
    .item .top{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:flex-start;
    }
    .badge{
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border:1px solid var(--line);
      color: var(--muted);
      white-space:nowrap;
    }
    .badge.ok{ border-color: #b7e4c7; color: var(--ok); background:#ecfdf3; }
    .badge.warn{ border-color: #fedf89; color: var(--warn); background:#fffaeb; }
    .badge.danger{ border-color: #f2c6c2; color: var(--danger); background:#fef3f2; }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .grid3{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    label{
      font-size: 12px;
      color: var(--muted);
    }
    textarea{
      border:1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      min-height: 90px;
      resize: vertical;
      background:#fff;
    }
    textarea.mono{ font-family: var(--mono); }
    .small{
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }
    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .split{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .hr{
      height:1px;
      background: var(--line);
      margin: 10px 0;
    }
    .kpi{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .kpi .box{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 12px;
      padding:8px 10px;
      font-size: 12px;
      min-width: 140px;
    }
    .kpi .box b{ display:block; font-size: 14px; }
    .rightTopRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }

    .modal{
      position: fixed;
      inset:0;
      background: rgba(17,24,39,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 50;
    }
    .modal.open{ display:flex; }
    .modal .dialog{
      width: min(980px, 100%);
      max-height: min(84vh, 820px);
      overflow:auto;
      background:#fff;
      border-radius: 14px;
      border:1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .dialog .dh{
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .dialog .db{ padding: 12px; }
    .pre{
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--mono);
      font-size: 12px;
      background:#0b1220;
      color:#e5e7eb;
      padding: 12px;
      border-radius: 12px;
      border:1px solid #111827;
    }

    @media (max-width: 980px){
      main{ grid-template-columns: 1fr; }
      .grid2, .grid3, .split{ grid-template-columns: 1fr; }
      header .row{ align-items:stretch; }
      .select, .input{ min-width: 0; flex: 1; }
    }
  </style>
</head>

<script>
/* ===========================
   0) Утилиты
=========================== */
const nowISO = () => new Date().toISOString();
const uid = (p="id") => `${p}_${Math.random().toString(16).slice(2)}_${Date.now().toString(16)}`;
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const toText = (v)=> (v==null ? "" : String(v));
const safeJSON = (s)=> { try { return JSON.parse(s); } catch(e){ return null; } };

function copyToClipboard(text){
  return navigator.clipboard.writeText(text);
}

function downloadText(filename, text, mime="application/json"){
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}

function csvEscape(v){
  const s = toText(v).replace(/\r?\n/g, " ").trim();
  if (/[",;]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
  return s;
}

/* ===========================
   1) Модель данных
   - Проект → Сегменты → Канвасы (Empathy/VPD/BMC) + Реестр гипотез
   - PROMPTS: поля заложены на 4 уровнях:
     a) project.prompts
     b) segment.prompts
     c) canvasItem.prompts
     d) hypothesis.prompts
=========================== */

const DEFAULT_PROMPT_FIELDS = () => ({
  title: "",
  purpose: "",
  variables: [
    // примеры переменных (можно менять/расширять)
    { key: "segment", description: "Описание сегмента" },
    { key: "context", description: "Контекст/ситуация" },
    { key: "hypothesis", description: "Формулировка гипотезы" },
    { key: "evidence", description: "Факты/цитаты/наблюдения" },
    { key: "criteria", description: "Критерий подтверждения" }
  ],
  systemPrompt: "",
  userPrompt: "",
  notes: "",
  tags: [],
  version: "v1",
  updatedAt: nowISO()
});

function makeProject(name="Новый проект"){
  return {
    id: uid("proj"),
    name,
    description: "",
    createdAt: nowISO(),
    updatedAt: nowISO(),

    prompts: {
      // общий «каркас» для LLM (можно использовать позже при интеграции)
      // сюда удобно класть правила, формат вывода, контроль терминологии и т.п.
      base: DEFAULT_PROMPT_FIELDS()
    },

    segments: [],
    hypotheses: [] // общий реестр по проекту (каждая гипотеза привязана к segmentId + refs)
  };
}

function makeSegment(name="Новый сегмент"){
  return {
    id: uid("seg"),
    name,
    situation: "",
    role: "",
    constraints: "",
    createdAt: nowISO(),
    updatedAt: nowISO(),

    prompts: {
      // подсказки под будущие промпты именно по сегменту
      segmentBrief: DEFAULT_PROMPT_FIELDS()
    },

    empathy: {
      // 1-7 как на карте
      who: "",
      goal: "",
      needToDo: "",
      sees: "",
      says: "",
      does: "",
      hears: "",
      thinksFeels: "",
      pains: "",
      conclusions: "",

      }

    vpd: {
      customerProfile: {
        jobs: "",
        pains: "",
        gains: "",

          profileSynthesis: DEFAULT_PROMPT_FIELDS()
        }
      },
      valueMap: {
        productsServices: "",

        }

    bmc: {
      keyPartners: "",
      keyActivities: "",

function makeHypothesis(segmentId){
  return {
    id: uid("hyp"),
    segmentId,

    title: "Гипотеза",
    statement: "",

    // классификация
    risk: "desirability", // desirability | feasibility | viability

    priority: 3, // 1..5
    confidence: 2, // 1..5

    // привязки к канвасам
    refs: {
      empathy: { area: "", itemKey: "" }, // area: sees/hears/says/does/thinksFeels/pains/conclusions/who/goal/needToDo
      vpd: { area: "", itemKey: "" },     // area: jobs/pains/gains/productsServices/painRelievers/gainCreators/fit
      bmc: { area: "", itemKey: "" }      // area: keyPartners/.../revenueStreams/costStructure
    },

    // проверка
    method: "interview", // interview | survey | observation | landing | fakeDoor | prototype | pilot | analytics
    criteria: "",
    expectedSignal: "",
    sample: "",
    owner: "",
    dueDate: "",

    evidence: {
      notes: "",
      quotes: "",
      links: "",
      attachmentsNote: "" // задел под будущие вложения (в MVP без хранения файлов)
    },

    prompts: {
      // шаблоны промптов именно на уровне гипотезы
      createTestPlan: DEFAULT_PROMPT_FIELDS(),
      analyzeEvidence: DEFAULT_PROMPT_FIELDS(),
      rewriteHypothesis: DEFAULT_PROMPT_FIELDS()
    },

    createdAt: nowISO(),
    updatedAt: nowISO()
  };
}

/* ===========================
   2) Хранилище (IndexedDB)
=========================== */

const DB_NAME = "rc_hypotheses_mvp";
const DB_VER = 1;
const STORE = "state";

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onerror = ()=>reject(req.error);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE);
      }
    };
    req.onsuccess = ()=>resolve(req.result);
  });
}

async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readonly");
    const st = tx.objectStore(STORE);
    const req = st.get(key);
    req.onerror = ()=>reject(req.error);
    req.onsuccess = ()=>resolve(req.result);
  });
}

async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    const st = tx.objectStore(STORE);
    const req = st.put(value, key);
    req.onerror = ()=>reject(req.error);
    req.onsuccess = ()=>resolve(true);
  });
}

/* ===========================
   3) Состояние приложения
=========================== */
const App = {
  state: null,

  ui: {
    tab: "hypotheses",
    selectedHypothesisId: null
  }
};

function defaultState(){
  const p = makeProject("Проект 1");
  const s = makeSegment("Сегмент 1");
  p.segments.push(s);
  p.hypotheses.push(makeHypothesis(s.id));
  return {
    version: "1.0",
    createdAt: nowISO(),
    updatedAt: nowISO(),
    activeProjectId: p.id,
    activeSegmentId: s.id,
    projects: [p]
  };
}

/* ===========================
   4) DOM
=========================== */
const el = (id)=>document.getElementById(id);

const projectSelect = el("projectSelect");
const segmentSelect = el("segmentSelect");
const leftList = el("leftList");
const rightTitle = el("rightTitle");
const rightBody = el("rightBody");
const tabs = el("tabs");
const searchInput = el("searchInput");
const filterStatus = el("filterStatus");
const filterRisk = el("filterRisk");
const kpiBox = el("kpiBox");
const storageBadge = el("storageBadge");

const modal = el("modal");
const modalTitle = el("modalTitle");
const modalHint = el("modalHint");
const modalText = el("modalText");
const modalFooter = el("modalFooter");
const fileInput = el("fileInput");

/* ===========================
   5) Поиск активных сущностей
=========================== */
function getActiveProject(){
  return App.state.projects.find(p=>p.id===App.state.activeProjectId) || null;
}
function getActiveSegment(){
  const p = getActiveProject();
  if(!p) return null;
  return p.segments.find(s=>s.id===App.state.activeSegmentId) || null;
}
function getHypothesisById(id){
  const p = getActiveProject();
  if(!p) return null;
  return p.hypotheses.find(h=>h.id===id) || null;
}

/* ===========================
   6) Рендер: селекты
=========================== */
function renderProjectSelect(){
  const st = App.state;
  projectSelect.innerHTML = "";
  st.projects.forEach(p=>{
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.name;
    projectSelect.appendChild(o);
  });
  projectSelect.value = st.activeProjectId || "";
}

function renderSegmentSelect(){
  const p = getActiveProject();
  segmentSelect.innerHTML = "";
  if(!p){ return; }
  p.segments.forEach(s=>{
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.name;
    segmentSelect.appendChild(o);
  });
  segmentSelect.value = App.state.activeSegmentId || "";
}

/* ===========================
   7) KPI
=========================== */
function renderKPI(){
  const p = getActiveProject();
  if(!p){ kpiBox.innerHTML = ""; return; }
  const total = p.hypotheses.length;
  const by = (k)=>p.hypotheses.filter(h=>h.status===k).length;
  const newC = by("new");
  const testingC = by("testing");
  const confC = by("confirmed");
  const rejC = by("rejected");

  kpiBox.innerHTML = "";
  const mk = (label, value)=>{
    const d = document.createElement("div");
    d.className = "box";
    d.innerHTML = `<b>${value}</b>${label}`;
    return d;
  };
  kpiBox.appendChild(mk("Всего гипотез", total));
  kpiBox.appendChild(mk("Не проверено", newC));
  kpiBox.appendChild(mk("В проверке", testingC));
  kpiBox.appendChild(mk("Подтверждено", confC));
  kpiBox.appendChild(mk("Опровергнуто", rejC));
}

/* ===========================
   8) Рендер: левый список
=========================== */
function matchesSearch(h, q){
  if(!q) return true;
  q = q.toLowerCase().trim();
  const hay = [
    h.title, h.statement, h.risk, h.status, h.method, h.criteria, h.expectedSignal,
    h.evidence?.notes, h.evidence?.quotes, h.evidence?.links, h.owner, h.sample
  ].map(toText).join(" ").toLowerCase();
  return hay.includes(q);
}

function renderLeftList(){
  const p = getActiveProject();
  const seg = getActiveSegment();
  leftList.innerHTML = "";

  if(!p){
    leftList.innerHTML = `<div class="muted">Нет активного проекта</div>`;
    return;
  }

  const q = searchInput.value || "";
  const fs = filterStatus.value || "";
  const fr = filterRisk.value || "";

  // Список зависит от вкладки:
  // - hypotheses: список гипотез по активному сегменту (или по всем, если сегмент не выбран)
  // - empathy/vpd/bmc/prompts/qa: оставляем список гипотез как основной навигатор (MVP)
  const list = p.hypotheses
    .filter(h => !seg || h.segmentId === seg.id)
    .filter(h => !fs || h.status === fs)
    .filter(h => !fr || h.risk === fr)
    .filter(h => matchesSearch(h, q))
    .sort((a,b)=>{
      // priority asc (1 важнее), затем updatedAt desc
      if(a.priority !== b.priority) return a.priority - b.priority;
      return new Date(b.updatedAt) - new Date(a.updatedAt);
    });

  if(list.length === 0){
    leftList.innerHTML = `<div class="muted">Ничего не найдено</div>`;
    return;
  }

  list.forEach(h=>{
    const div = document.createElement("div");
    div.className = "item" + (App.ui.selectedHypothesisId===h.id ? " active" : "");
    const statusBadge = ({
      new: `<span class="badge warn">не проверено</span>`,
      testing: `<span class="badge warn">в проверке</span>`,
      confirmed: `<span class="badge ok">подтверждено</span>`,
      rejected: `<span class="badge danger">опровергнуто</span>`
    })[h.status] || `<span class="badge">—</span>`;

    const riskLabel = ({
      desirability:"желательность",
      feasibility:"исполнимость",
      viability:"жизнеспособность"
    })[h.risk] || h.risk;

    div.innerHTML = `
      <div class="top">
        <div style="display:flex; flex-direction:column; gap:4px; min-width:0;">
          <b style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${toText(h.title) || "Без названия"}</b>
          <div class="muted" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${riskLabel} · приоритет ${h.priority}/5 · уверенность ${h.confidence}/5
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
          ${statusBadge}
          <span class="badge">${toText(h.method)}</span>
        </div>
      </div>
      <div class="muted" style="margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
        ${toText(h.statement) || "—"}
      </div>
    `;
    div.addEventListener("click", ()=>{
      App.ui.selectedHypothesisId = h.id;
      renderAll();
    });
    leftList.appendChild(div);
  });
}

function tabButtonActive(){
  [...tabs.querySelectorAll(".tab")].forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === App.ui.tab);

}

function renderRight(){
  const p = getActiveProject();
  const seg = getActiveSegment();
  const h = App.ui.selectedHypothesisId ? getHypothesisById(App.ui.selectedHypothesisId) : null;

  // если ничего не выбрано — выбираем первую гипотезу сегмента
  if(p && !h){
    const first = p.hypotheses.find(x=>!seg || x.segmentId===seg.id);
    if(first){
      App.ui.selectedHypothesisId = first.id;
      return renderRight();
    }
  }

  const tab = App.ui.tab;
  tabButtonActive();

  if(tab === "empathy"){
    rightTitle.textContent = "Empathy Map";
    rightBody.innerHTML = renderEmpathy(seg);
    bindEmpathy(seg);
    return;
  }
  if(tab === "vpd"){
    rightTitle.textContent = "VPD (Customer Profile / Value Map)";
    rightBody.innerHTML = renderVPD(seg);
    bindVPD(seg);
    return;
  }
  if(tab === "bmc"){

    rightBody.innerHTML = renderBMC(seg);

    return;

  if(tab === "prompts"){

    rightBody.innerHTML = renderPrompts(p, seg, h);

    rightTitle.textContent = "Проверки качества (валидаторы)";
    rightBody.innerHTML = renderQA(p, seg);
    bindQA(p, seg);
    return;

function bindHypothesis(p, seg, h){
  if(!h) return;

  // set selects initial values
  el("h_risk").value = h.risk;
  el("h_status").value = h.status;
  el("h_method").value = h.method;

  const on = (id, fn)=> el(id).addEventListener("input", fn);
  const onChange = (id, fn)=> el(id).addEventListener("change", fn);

  on("h_title", ()=>{ h.title = el("h_title").value; touchHypothesis(h); });
  on("h_statement", ()=>{ h.statement = el("h_statement").value; touchHypothesis(h); });

  onChange("h_risk", ()=>{ h.risk = el("h_risk").value; touchHypothesis(h); renderLeftList(); renderKPI(); });
  onChange("h_status", ()=>{ h.status = el("h_status").value; touchHypothesis(h); renderLeftList(); renderKPI(); });

  on("h_priority", ()=>{ h.priority = clamp(parseInt(el("h_priority").value||"3",10),1,5); touchHypothesis(h); renderLeftList(); });
  on("h_confidence", ()=>{ h.confidence = clamp(parseInt(el("h_confidence").value||"2",10),1,5); touchHypothesis(h); renderLeftList(); });

  on("h_ref_empathy", ()=>{ h.refs.empathy.area = el("h_ref_empathy").value.trim(); touchHypothesis(h); });
  on("h_ref_vpd", ()=>{ h.refs.vpd.area = el("h_ref_vpd").value.trim(); touchHypothesis(h); });
  on("h_ref_bmc", ()=>{ h.refs.bmc.area = el("h_ref_bmc").value.trim(); touchHypothesis(h); });

  onChange("h_method", ()=>{ h.method = el("h_method").value; touchHypothesis(h); renderLeftList(); });
  on("h_owner", ()=>{ h.owner = el("h_owner").value; touchHypothesis(h); });
  on("h_dueDate", ()=>{ h.dueDate = el("h_dueDate").value; touchHypothesis(h); });

  on("h_criteria", ()=>{ h.criteria = el("h_criteria").value; touchHypothesis(h); });
  on("h_expected", ()=>{ h.expectedSignal = el("h_expected").value; touchHypothesis(h); });
  on("h_sample", ()=>{ h.sample = el("h_sample").value; touchHypothesis(h); });
  on("h_methodNotes", ()=>{ h.evidence.attachmentsNote = el("h_methodNotes").value; touchHypothesis(h); });

  on("h_e_notes", ()=>{ h.evidence.notes = el("h_e_notes").value; touchHypothesis(h); });
  on("h_e_quotes", ()=>{ h.evidence.quotes = el("h_e_quotes").value; touchHypothesis(h); });
  on("h_e_links", ()=>{ h.evidence.links = el("h_e_links").value; touchHypothesis(h); });

  // prompt fields bindings (hypothesis-level)
  bindPromptFields(h.prompts.createTestPlan, "pf_createTestPlan_");
  bindPromptFields(h.prompts.analyzeEvidence, "pf_analyzeEvidence_");
  bindPromptFields(h.prompts.rewriteHypothesis, "pf_rewriteHypothesis_");

  el("btnDeleteHypothesis").addEventListener("click", ()=>{
    if(!confirm("Удалить гипотезу без возможности восстановления?")) return;
    const idx = p.hypotheses.findIndex(x=>x.id===h.id);
    if(idx>=0) p.hypotheses.splice(idx,1);
    App.ui.selectedHypothesisId = null;
    touchProject(p);
    saveState();
    renderAll();
  });
}

function touchProject(p){
  p.updatedAt = nowISO();
  App.state.updatedAt = nowISO();
}
function touchSegment(s){
  s.updatedAt = nowISO();
  App.state.updatedAt = nowISO();
}
function touchHypothesis(h){
  h.updatedAt = nowISO();
  const p = getActiveProject();
  if(p) touchProject(p);
  saveStateDebounced();
}

function bindPromptFields(target, prefix){
  const p = target;

  const setUpdated = ()=>{ p.updatedAt = nowISO(); const u = el(prefix+"updated"); if(u) u.value = p.updatedAt; saveStateDebounced(); };

  const parseVars = (txt)=>{
    const lines = (txt||"").split("\n").map(x=>x.trim()).filter(Boolean);
    const vars = [];
    for(const line of lines){
      const idx = line.indexOf(":");
      if(idx<1) continue;
      const key = line.slice(0, idx).trim();
      const description = line.slice(idx+1).trim();
      if(key) vars.push({key, description});
    }
    return vars;
  };

  const on = (id, fn)=>{ const e = el(id); if(e) e.addEventListener("input", fn); };

  on(prefix+"title", ()=>{ p.title = el(prefix+"title").value; setUpdated(); });
  on(prefix+"version", ()=>{ p.version = el(prefix+"version").value; setUpdated(); });
  on(prefix+"purpose", ()=>{ p.purpose = el(prefix+"purpose").value; setUpdated(); });
  on(prefix+"system", ()=>{ p.systemPrompt = el(prefix+"system").value; setUpdated(); });
  on(prefix+"user", ()=>{ p.userPrompt = el(prefix+"user").value; setUpdated(); });
  on(prefix+"notes", ()=>{ p.notes = el(prefix+"notes").value; setUpdated(); });

  on(prefix+"vars", ()=>{ p.variables = parseVars(el(prefix+"vars").value); setUpdated(); });
  on(prefix+"tags", ()=>{
    const raw = el(prefix+"tags").value;
    p.tags = raw.split(",").map(x=>x.trim()).filter(Boolean);
    setUpdated();
  });
}

/* --------- QA / Validators --------- */
function validateProject(p){
  const issues = [];

  if(!p.name.trim()) issues.push({level:"danger", msg:"Проект: пустое имя."});
  if(p.segments.length === 0) issues.push({level:"danger", msg:"Проект: нет ни одного сегмента."});

  // BMC basic viability checks per segment
  for(const s of p.segments){
    const b = s.bmc;
    const hasRev = toText(b.revenueStreams).trim().length > 0;
    const hasCost = toText(b.costStructure).trim().length > 0;
    if(!hasRev) issues.push({level:"warn", msg:`Сегмент «${s.name}»: BMC без Revenue Streams.`});
    if(!hasCost) issues.push({level:"warn", msg:`Сегмент «${s.name}»: BMC без Cost Structure.`});
  }

  // Hypotheses quality
  for(const h of p.hypotheses){
    if(!toText(h.statement).trim()) issues.push({level:"danger", msg:`Гипотеза «${h.title}»: нет формулировки.`});
    if(!toText(h.criteria).trim()) issues.push({level:"warn", msg:`Гипотеза «${h.title}»: нет критерия подтверждения.`});
    if(!toText(h.expectedSignal).trim()) issues.push({level:"warn", msg:`Гипотеза «${h.title}»: нет ожидаемого сигнала/метрики.`});

    // VPD link quality hint
    const vref = toText(h.refs?.vpd?.area).trim();
    if(h.risk==="desirability" && !vref) issues.push({level:"warn", msg:`Гипотеза «${h.title}»: риск «желательность», но нет привязки к VPD.`});

    // "общие слова" heuristic
    const weakWords = ["удобно","быстро","эффективно","качественно","лучше","оптимально","просто","понятно"];
    const st = toText(h.statement).toLowerCase();
    const hits = weakWords.filter(w=>st.includes(w));
    if(hits.length>0) issues.push({level:"warn", msg:`Гипотеза «${h.title}»: возможная неконкретность (слова: ${hits.join(", ")}).`});
  }

  return issues;
}

function renderQA(p, seg){
  if(!p) return `<div class="muted">Нет активного проекта</div>`;
  const issues = validateProject(p);

  return `
    <div class="stack">
      <div class="small">
        Проверки — эвристики для качества гипотез и согласованности канвасов. Они не заменяют экспертную проверку, но быстро подсвечивают пробелы.
      </div>

      <div class="card" style="box-shadow:none;">
        <div class="card-h">
          <h2>Результат</h2>
          <span class="badge">${issues.length} замечаний</span>
        </div>
        <div class="card-b">
          ${issues.length===0 ? `<div class="badge ok">Замечаний нет</div>` : `
            <div class="list">
              ${issues.map(i=>`
                <div class="item" style="cursor:default;">
                  <div class="top">
                    <b style="font-size:13px;">${i.msg}</b>
                    <span class="badge ${i.level}">${i.level}</span>
                  </div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      </div>

      <div class="card" style="box-shadow:none;">
        <div class="card-h"><h2>Рекомендованные правила (задел под промпты)</h2></div>
        <div class="card-b">
          <div class="small">
            Эти правила обычно переносятся в Project.prompts.base:
            1) Все пункты — только проверяемые утверждения.
            2) Каждая гипотеза должна иметь критерий и ожидаемый сигнал.
            3) Pain Relievers обязаны ссылаться на конкретные Pains; Gain Creators — на Gains.
            4) Для жизнеспособности обязательно: Revenue Streams + Cost Structure.
          </div>
        </div>
      </div>
    </div>
  `;
}

  App.state = defaultState();
  App.ui.selectedHypothesisId = null;
  await saveState();

/* ===========================

el("btnSave").addEventListener("click", async ()=>{

  renderKPI();

el("btnCopyPrompt").addEventListener("click", async ()=>{
  const prompt = buildPromptPreview();
  await copyToClipboard(prompt);
  storageBadge.textContent = "Промпт: скопировано";
  setTimeout(()=>storageBadge.textContent = "Хранилище: IndexedDB", 1200);
});

/* ===========================
   15) Сборка промпта (задел)
   Сейчас это простая сборка из Project.base + Segment.brief + Hypothesis.rewriteHypothesis (если есть),
   чтобы кнопка «Скопировать промпт» уже работала.
=========================== */
function buildPromptPreview(){
  const p = getActiveProject();
  const s = getActiveSegment();
  const h = App.ui.selectedHypothesisId ? getHypothesisById(App.ui.selectedHypothesisId) : null;

  const parts = [];
  if(p?.prompts?.base?.systemPrompt) parts.push("SYSTEM:\n" + p.prompts.base.systemPrompt.trim());
  if(p?.prompts?.base?.userPrompt) parts.push("USER:\n" + p.prompts.base.userPrompt.trim());

  if(s?.prompts?.segmentBrief?.userPrompt){
    parts.push("SEGMENT USER:\n" + s.prompts.segmentBrief.userPrompt.trim());
  }

  if(h?.prompts?.rewriteHypothesis?.userPrompt){
    parts.push("HYPOTHESIS USER:\n" + h.prompts.rewriteHypothesis.userPrompt.trim());
  }

  // переменные (пока как «ручная подстановка»)
  const vars = [
    ["segment", s ? s.name : ""],
    ["context", s ? [s.situation, s.role, s.constraints].filter(Boolean).join(" | ") : ""],
    ["hypothesis", h ? h.statement : ""],
    ["evidence", h ? [h.evidence?.notes, h.evidence?.quotes, h.evidence?.links].filter(Boolean).join("\n") : ""],
    ["criteria", h ? h.criteria : ""],
  ];

  const varBlock = vars.map(([k,v])=>`${k}:\n${toText(v).trim()}\n`).join("\n");

  return (parts.join("\n\n---\n\n") + "\n\n---\n\n" + "INPUT VARIABLES:\n" + varBlock).trim();
}

/* ===========================
   16) Modal
=========================== */
function openModal(title, hint, setup){
  modalTitle.textContent = title;
  modalHint.textContent = hint || "";
  modalText.value = "";
  modalFooter.innerHTML = "";
  setup?.();
  modal.classList.add("open");
}
el("btnModalClose").addEventListener("click", ()=> modal.classList.remove("open"));
modal.addEventListener("click", (e)=>{ if(e.target===modal) modal.classList.remove("open"); });

el("btnModalCopy").addEventListener("click", async ()=>{
  await copyToClipboard(modalText.value || "");
  modalHint.textContent = "Скопировано в буфер обмена.";
  setTimeout(()=>modalHint.textContent = "", 1200);
});

/* ===========================
   17) Сохранение
=========================== */
async function saveState(){
  await idbSet("app_state", App.state);
}
let saveTimer = null;
function saveStateDebounced(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveState(), 250);
}

/* ===========================
   18) Инициализация
=========================== */
async function init(){
  const stored = await idbGet("app_state");
  App.state = stored || defaultState();
  storageBadge.textContent = "Хранилище: IndexedDB";
  renderAll();
}

function renderAll(){
  renderProjectSelect();
  renderSegmentSelect();
  renderKPI();
  renderLeftList();
  renderRight();
}

init();
</script>
